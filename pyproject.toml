[project]
name = "jellyfin-plugin-toolkit"
version = "0.6.2"
description = "Build, develop, and validate independent Jellyfin plugins"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.14.1,<3",
    "tomli-w>=1.2,<2",
    "typer>=0.27.3,<0.28",
]

[project.scripts]
jpt = "jellyfin_plugin_toolkit.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17.1,<0.18",
    "mypy>=2.4,<3",
    "basedpyright>=1.40.2,<2",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.5"
python-preference = "only-managed"
exclude-newer = "1 day"

[tool.ruff]
extend = "src/jellyfin_plugin_toolkit/resources/configs/ruff.toml"
target-version = "py315"

[tool.uv.build-backend]
source-include = [
  ".github/actions/**",
  "uv.lock",
  ".python-version",
  "GPL-3.0.txt",
  "MPL-2.0.txt",
  "licenses.spdx.json",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.15"
files = ["src", "tests"]
strict = true

[tool.basedpyright]
extends = "src/jellyfin_plugin_toolkit/resources/configs/basedpyright.toml"
venvPath = "."
venv = ".venv"
pythonVersion = "3.15"
include = ["src", "tests"]
extraPaths = ["src", "tests"]

[tool.jpt.quality]
checks = ["python", "javascript", "typescript", "docs", "workflows", "renovate"]
typescript_projects = ["tsconfig.json"]
renovate_tests = "tests/renovate-attachments.mjs"
