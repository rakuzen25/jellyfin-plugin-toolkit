name: Toolkit validation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  workflow_call:
    inputs:
      ref:
        description: Immutable toolkit source revision to validate
        type: string
        default: ""
    outputs:
      artifact_id:
        description: Candidate distributions and checksums tested by every consumer variant
        value: ${{ jobs.candidate.outputs.artifact_id }}
permissions:
  contents: read
concurrency:
  group: toolkit-validation-${{ github.repository }}-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}
jobs:
  candidate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-event-candidate' || 'candidate' }}
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
      - run: uv sync --locked
      - run: uv build
      - run: uv run --no-sync jpt internal toolkit-release manifest --sha "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: archive
        with:
          name: toolkit-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/jellyfin_plugin_toolkit-*.whl
            dist/jellyfin_plugin_toolkit-*.tar.gz
            dist/SHA256SUMS
            dist/build-provenance.json
          if-no-files-found: error
          retention-days: 14
  toolkit:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-event-toolkit' || 'toolkit' }}
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          install: false
          node-version-file: .node-version
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: uv run --no-sync jpt prepare
      - run: uv run --no-sync jpt check
      - run: uv run --no-sync python -m unittest discover -s tests
      - run: node --test src/jellyfin_plugin_toolkit/resources/ui/lifecycle.test.ts tests/*.test.mjs
      - name: Check out the pinned Release Please runtime for updater tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: googleapis/release-please-action
          ref: 45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
          path: .build/release-please-runtime
          persist-credentials: false
      - name: Install locked Release Please test dependencies
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
        working-directory: .build/release-please-runtime
      - name: Verify internal version updates with Release Please
        env:
          RELEASE_PLEASE_RUNTIME: .build/release-please-runtime
        run: node tests/release-please-updates.mjs
      - name: Validate Renovate wheel updates
        run: >-
          docker run --rm --network none --entrypoint node -v "$PWD:/toolkit:ro"
          ghcr.io/renovatebot/renovate:44.134.1@sha256:79138db6b794ea9e00b52f3012e3d3912653214f3166bea537689196e5e91e21
          /toolkit/tests/renovate-attachments.mjs
  starter:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-event-starter' || format('starter ({0})', matrix.label) }}
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    needs: candidate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: backend-only
            label: backend
          - variant: admin-ui-custom-project-path
            label: administrator-override
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          install: false
          node-version-file: .node-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify candidate distributions
        run: cd dist && sha256sum --strict -c SHA256SUMS
      - name: Generate an independent consumer
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          uv init --bare --no-package --no-workspace --managed-python --python "$(cat .python-version)" "$RUNNER_TEMP/generator"
          uv add --managed-python --exclude-newer "1 day" --project "$RUNNER_TEMP/generator" "$GITHUB_WORKSPACE"/dist/jellyfin_plugin_toolkit-*.whl
          args=()
          if [ "$VARIANT" = admin-ui-custom-project-path ]; then
            args+=(--admin --host-project server/Entry.csproj)
          fi
          uv run --project "$RUNNER_TEMP/generator" --no-sync jpt new "$RUNNER_TEMP/starter" --id fixture-third --name 'Fixture Third' --repository fixture/third "${args[@]}" --toolkit-wheel "$GITHUB_WORKSPACE"/dist/jellyfin_plugin_toolkit-*.whl --toolkit-revision "$(git rev-parse HEAD)"
      - name: Bootstrap and exercise the generated consumer
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cd "$RUNNER_TEMP/starter"
          uv sync --locked
          uv run --no-sync jpt bootstrap
          uv run --no-sync jpt format
          uv run --no-sync jpt check
          uv run --no-sync jpt test
          uv run --no-sync jpt test advisories
          uv run --no-sync jpt build
          uv run --no-sync python "$GITHUB_WORKSPACE/tests/dev_smoke.py" "$PWD" --edits
          uv run --no-sync jpt test installation
          uv run --no-sync jpt test reproducibility
          if [ "$VARIANT" = admin-ui-custom-project-path ]; then uv run --no-sync jpt test browser -- --project workflow-chromium; fi

  advisories:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-event-advisories' || 'advisories' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          install: false
          node-version-file: .node-version
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync jpt test advisories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: toolkit-advisories
          path: dist/evidence/advisories.json
          if-no-files-found: warn
  validation-evidence:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-event-evidence' || 'validation-evidence' }}
    needs: [candidate, toolkit, starter, advisories]
    if: always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
      - run: uv sync --locked
      - name: Bind successful validation to its tested candidate
        env:
          SOURCE_REVISION: ${{ inputs.ref || github.sha }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
          VALIDATION_RESULTS: '{"candidate":"${{ needs.candidate.result }}","toolkit":"${{ needs.toolkit.result }}","starter":"${{ needs.starter.result }}","advisories":"${{ needs.advisories.result }}"}'
        run: uv run --no-sync jpt internal toolkit-release validation-receipt --sha "$SOURCE_REVISION" --artifact-id "$CANDIDATE_ARTIFACT_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolkit-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/validation/validation.json
          if-no-files-found: error
          retention-days: 14
