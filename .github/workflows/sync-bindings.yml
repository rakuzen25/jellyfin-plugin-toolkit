name: Synchronize toolkit bindings
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        default: ""
      pr_number:
        type: string
        default: ""
      bot_login:
        type: string
        default: renovate[bot]
      app_client_id:
        type: string
        required: true
    secrets:
      PLUGIN_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: toolkit-sync-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install the verified base release
        run: uv sync --locked
      - name: Prepare with trusted code and read-only credentials
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BOT_LOGIN: ${{ inputs.bot_login }}
        run: |
          args=()
          if [ -n "$RUN_ID" ]; then args+=(--run-id "$RUN_ID"); fi
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER"); fi
          uv run --no-sync jpt internal binding-pr prepare --bot "$BOT_LOGIN" --proposal "$RUNNER_TEMP/bindings.json" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.plan.outputs.ready == 'true'
        with:
          name: toolkit-binding-proposal
          path: ${{ runner.temp }}/bindings.json
          retention-days: 1
          if-no-files-found: error
  commit:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync jpt prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: toolkit-binding-proposal
          path: ${{ runner.temp }}/binding-proposal
      - name: Create repository-scoped synchronization token
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@27f61490cc183093f30cbf1dba50bb299920b23c # shared App token action
        id: app
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write
      - name: Recompute and commit the bounded update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JPT_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BOT_LOGIN: ${{ inputs.bot_login }}
        run: uv run --no-sync jpt internal binding-pr commit --bot "$BOT_LOGIN" --proposal "$RUNNER_TEMP/binding-proposal/bindings.json"
