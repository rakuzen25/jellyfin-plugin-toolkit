name: Synchronize toolkit bindings
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        default: ""
      pr_number:
        type: string
        default: ""
      bot_login:
        type: string
        default: renovate[bot]
      app_client_id:
        type: string
        required: true
    secrets:
      PLUGIN_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: toolkit-sync-${{ github.repository }}
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - name: Select a current toolkit dependency update
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BOT_LOGIN: ${{ inputs.bot_login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const { REPOSITORY: repository, RUN_ID: runId, PR_NUMBER: number, BOT_LOGIN: bot, DEFAULT_BRANCH: branch } = process.env;
          const api = (path) => JSON.parse(execFileSync('gh', ['api', `repos/${repository}/${path}`], { encoding: 'utf8' }));
          function select() {
            let candidates, sha;
            if (number) {
              if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid PR number');
              candidates = [api(`pulls/${number}`)];
            } else {
              if (!/^[1-9][0-9]*$/.test(runId)) throw new Error('Invalid run ID');
              const run = api(`actions/runs/${runId}`);
              if (run.event !== 'pull_request' || run.status !== 'completed' || run.path !== '.github/workflows/validate.yml' || run.head_repository?.full_name !== repository) return;
              const jobs = api(`actions/runs/${runId}/jobs?filter=latest&per_page=100`);
              if (jobs.total_count > 100) throw new Error('Validation job inventory exceeds the supported bound');
              if (!jobs.jobs.some(job => ['validate', 'catalog-validate'].includes(job.name.split(' / ').at(-1)))) return;
              sha = run.head_sha;
              if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid source revision');
              candidates = api(`commits/${sha}/pulls`);
            }
            const eligible = candidates.filter(pr => pr.state === 'open' && pr.user?.login === bot && pr.user?.type === 'Bot' && pr.base?.repo?.full_name === repository && pr.head?.repo?.full_name === repository && pr.base?.ref === branch && (!sha || pr.head.sha === sha));
            if (eligible.length !== 1) return;
            const pr = eligible[0];
            for (const side of ['base', 'head']) if (!/^[a-f0-9]{40}$/.test(pr[side].sha)) throw new Error('Invalid PR revision');
            const source = revision => {
              const file = api(`contents/pyproject.toml?ref=${revision}`);
              const matches = Buffer.from(file.content, 'base64').toString('utf8').match(/https:\/\/github\.com\/rakuzen25\/jellyfin-plugin-toolkit\/releases\/download\/v[0-9.]+\/jellyfin_plugin_toolkit-[0-9.]+-py3-none-any\.whl/g) ?? [];
              return matches.length === 1 ? matches[0] : undefined;
            };
            const before = source(pr.base.sha), after = source(pr.head.sha);
            if (!before || before === after) return;
            return pr.base.sha;
          }
          const base = select();
          appendFileSync(process.env.GITHUB_OUTPUT, `ready=${Boolean(base)}\nbase=${base ?? ''}\n`);
          console.log(base ? 'Toolkit update selected; trusted-base verification follows.' : 'No current toolkit dependency update; no environment or App token needed.');
          JS
  prepare:
    needs: route
    if: needs.route.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.route.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - name: Prepare with trusted code and read-only credentials
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BOT_LOGIN: ${{ inputs.bot_login }}
        run: |
          args=()
          if [ -n "$RUN_ID" ]; then args+=(--run-id "$RUN_ID"); fi
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER"); fi
          uv run --no-sync jpt internal binding-pr prepare --bot "$BOT_LOGIN" --proposal "$RUNNER_TEMP/bindings.json" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.plan.outputs.ready == 'true'
        with:
          name: toolkit-binding-proposal
          path: ${{ runner.temp }}/bindings.json
          retention-days: 1
          if-no-files-found: error
  commit:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: toolkit-binding-proposal
          path: ${{ runner.temp }}/binding-proposal
      - name: Create repository-scoped synchronization token
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@27f61490cc183093f30cbf1dba50bb299920b23c # shared App token action
        id: app
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write
      - name: Recompute and commit the bounded update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JPT_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BOT_LOGIN: ${{ inputs.bot_login }}
        run: uv run --no-sync jpt internal binding-pr commit --bot "$BOT_LOGIN" --proposal "$RUNNER_TEMP/binding-proposal/bindings.json"
