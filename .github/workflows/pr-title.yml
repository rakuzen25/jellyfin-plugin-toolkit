name: Check PR title
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pr-title-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-title:
    runs-on: ubuntu-26.04
    steps:
      - name: Check Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^\)]+\))?!?:\ .+ ]]; then
            echo 'Use a Conventional Commit title, for example: fix(ci): avoid duplicate validation'
            exit 1
          fi
