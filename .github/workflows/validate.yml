name: Validate release candidate
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      base:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""
      release_mode:
        type: boolean
        default: false
      full:
        type: boolean
        default: false
      scheduled:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: validation-${{ github.repository }}-${{ (inputs.scheduled || github.workflow == 'Changed-input full safety check') && 'scheduled' || inputs.release_tag || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !inputs.scheduled && github.workflow != 'Changed-input full safety check' }}
defaults:
  run:
    shell: bash
env:
  RELEASE_MODE: ${{ inputs.release_mode || false }}
  RELEASE_TAG: ${{ inputs.release_tag || '' }}
  REPOSITORY: ${{ github.repository }}
  CI_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  impact:
    runs-on: ubuntu-26.04
    outputs:
      metadata: ${{ steps.plan.outputs.metadata }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
      tooling: ${{ steps.plan.outputs.tooling }}
      workflow: ${{ steps.plan.outputs.workflow }}
      rendering: ${{ steps.plan.outputs.rendering }}
      performance: ${{ steps.plan.outputs.performance }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      web: ${{ steps.plan.outputs.web }}
      audit: ${{ steps.plan.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - run: uv run --no-sync jpt release prepare --repository "$REPOSITORY" --tag "$RELEASE_TAG" --environment "$GITHUB_ENV"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ inputs.full || false }}
          SCHEDULED: ${{ inputs.scheduled || false }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            if comparison_base=$(git merge-base "$BASE" HEAD); then
              BASE="$comparison_base"
            else
              echo "Comparison history unavailable; selecting full validation."
              BASE=""
            fi
          fi
          args=(--reuse --base "$BASE")
          if [ "$FULL" = true ]; then args+=(--full); fi
          if [ "$SCHEDULED" = true ]; then args+=(--scheduled); fi
          if [ "$RELEASE_MODE" = true ]; then args+=(--release); fi
          uv run --no-sync jpt internal ci plan "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-plan
          path: dist/plan.json
          if-no-files-found: error
  quality:
    needs: impact
    if: needs.impact.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      docs: ${{ steps.docs.outcome }}
      automation: ${{ steps.automation.outcome }}
      tooling: ${{ steps.tooling.outcome }}
      tooling-tests: ${{ steps.tooling-tests.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - run: mkdir -p dist/evidence
      - name: Check documentation
        id: docs
        if: ${{ !cancelled() }}
        run: uv run --no-sync jpt check docs 2>&1 | tee dist/evidence/docs.log
      - name: Check automation
        id: automation
        if: ${{ !cancelled() && needs.impact.outputs.metadata == 'true' }}
        run: uv run --no-sync jpt check automation 2>&1 | tee dist/evidence/automation.log
      - name: Check tooling
        id: tooling
        if: ${{ !cancelled() && needs.impact.outputs.tooling == 'true' }}
        run: uv run --no-sync jpt check tooling 2>&1 | tee dist/evidence/tooling.log
      - name: Test tooling
        id: tooling-tests
        if: ${{ !cancelled() && needs.impact.outputs.tooling == 'true' }}
        run: uv run --no-sync jpt test tooling 2>&1 | tee -a dist/evidence/tooling.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-quality
  frontend:
    needs: impact
    if: needs.impact.outputs.web == 'true'
    outputs:
      workflow: ${{ steps.refine.outputs.workflow }}
      rendering: ${{ steps.refine.outputs.rendering }}
      performance: ${{ steps.refine.outputs.performance }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - run: mkdir -p dist/evidence
      - name: Check affected frontend inputs
        if: needs.impact.outputs.frontend == 'true'
        run: (pnpm check frontend && pnpm test frontend) 2>&1 | tee dist/evidence/frontend-checks.log
      - run: (uv run --no-sync jpt build frontend && uv run --no-sync jpt internal ci web-record) 2>&1 | tee dist/evidence/frontend-build.log
      - run: uv run --no-sync jpt test web-installation -- --assets dist/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validation-plan
          path: dist
      - name: Resolve emitted browser identity and reuse
        id: refine
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync jpt internal ci refine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-plan-web
          path: dist/plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-assets
          path: |
            dist/web/
            dist/web-build.json
          if-no-files-found: error
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-frontend
  backend:
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    needs: [impact, frontend]
    if: always() && needs.impact.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') && needs.impact.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-dotnet@efb1f21818f7d62f31d16d37064ddf5368920a8e # reviewed native NuGet cache setup
        with:
          project-directory: .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/jellyfin
          key: official-jellyfin-linux-amd64-${{ hashFiles('plugin.toml', 'uv.lock') }}
      - run: uv run --no-sync jpt internal references
      - run: uv run --no-sync jpt internal restore-backend
      - run: mkdir -p dist/evidence
      - name: Check .NET formatting
        run: uv run --no-sync jpt check backend 2>&1 | tee dist/evidence/dotnet-format.log
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.impact.outputs.web == 'true'
        with:
          name: browser-assets
          path: dist
      - if: needs.impact.outputs.web == 'true'
        run: uv run --no-sync jpt internal ci web-verify
      - run: uv run --no-sync jpt test backend -- --results-directory dist/evidence --report-xunit-trx 2>&1 | tee dist/evidence/backend.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-backend
  workflow:
    needs: [impact, frontend]
    if: needs.frontend.outputs.workflow == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - run: mkdir -p dist/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.impact.outputs.web == 'true'
        with:
          name: browser-assets
          path: dist
      - if: needs.impact.outputs.web == 'true'
        run: uv run --no-sync jpt internal ci web-verify
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validation-plan-web
          path: dist
      - run: uv run --no-sync jpt internal ci browser-verify --group workflow --project "workflow-chromium" --workers 2
      - run: CI_BROWSER_GROUP=workflow uv run --no-sync jpt test browser -- --project workflow-chromium --workers=2 2>&1 | tee dist/evidence/browser.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-workflow
  rendering:
    needs: [impact, frontend]
    if: needs.frontend.outputs.rendering == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - run: mkdir -p dist/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.impact.outputs.web == 'true'
        with:
          name: browser-assets
          path: dist
      - if: needs.impact.outputs.web == 'true'
        run: uv run --no-sync jpt internal ci web-verify
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validation-plan-web
          path: dist
      - run: uv run --no-sync jpt internal ci browser-verify --group rendering --project "${{ matrix.project }}" --workers 2
      - run: CI_BROWSER_GROUP=rendering uv run --no-sync jpt test browser -- --project "${{ matrix.project }}" --workers=2 2>&1 | tee dist/evidence/browser.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-rendering${{ matrix.project }}
  performance:
    needs: [impact, frontend]
    if: needs.frontend.outputs.performance == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [stress-chromium, stress-mobile-chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - run: mkdir -p dist/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.impact.outputs.web == 'true'
        with:
          name: browser-assets
          path: dist
      - if: needs.impact.outputs.web == 'true'
        run: uv run --no-sync jpt internal ci web-verify
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validation-plan-web
          path: dist
      - run: uv run --no-sync jpt internal ci browser-verify --group performance --project "${{ matrix.project }}" --workers 1
      - run: CI_BROWSER_GROUP=performance uv run --no-sync jpt test browser -- --project "${{ matrix.project }}" --workers=1 2>&1 | tee dist/evidence/browser.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-performance${{ matrix.project }}
  package:
    needs: [impact, frontend]
    if: always() && needs.impact.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.impact.outputs.artifacts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-dotnet@efb1f21818f7d62f31d16d37064ddf5368920a8e # reviewed native NuGet cache setup
        with:
          project-directory: .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/jellyfin
          key: official-jellyfin-linux-amd64-${{ hashFiles('plugin.toml', 'uv.lock') }}
      - run: uv run --no-sync jpt internal references
      - run: mkdir -p dist/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.impact.outputs.web == 'true'
        with:
          name: browser-assets
          path: dist
      - if: needs.impact.outputs.web == 'true'
        run: uv run --no-sync jpt internal ci web-verify
      - run: uv run --no-sync jpt release prepare --repository "$REPOSITORY" --tag "$RELEASE_TAG" --environment "$GITHUB_ENV"
      - name: Build clean candidate with verified browser assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ needs.impact.outputs.web }}" = true ]; then args+=(--prepared-web); fi
          if [ "$RELEASE_MODE" = true ]; then args+=(--release); fi
          uv run --no-sync jpt build "${args[@]}" 2>&1 | tee dist/evidence/package.log
      - run: uv run --no-sync jpt test artifact-inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-unverified
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS
            dist/clean-build.json
          if-no-files-found: error
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-package
  installation:
    needs: [impact, package]
    if: always() && needs.impact.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.impact.outputs.artifacts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-dotnet@efb1f21818f7d62f31d16d37064ddf5368920a8e # reviewed native NuGet cache setup
        with:
          project-directory: .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/jellyfin
          key: official-jellyfin-linux-amd64-${{ hashFiles('plugin.toml', 'uv.lock') }}
      - run: uv run --no-sync jpt internal references
      - run: mkdir -p dist/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-unverified
          path: dist
      - run: uv run --no-sync jpt test installation 2>&1 | tee dist/evidence/installation.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-installation
  reproducibility:
    needs: [impact, package]
    if: always() && needs.impact.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.impact.outputs.artifacts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-dotnet@efb1f21818f7d62f31d16d37064ddf5368920a8e # reviewed native NuGet cache setup
        with:
          project-directory: .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/jellyfin
          key: official-jellyfin-linux-amd64-${{ hashFiles('plugin.toml', 'uv.lock') }}
      - run: uv run --no-sync jpt internal references
      - run: mkdir -p dist/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-unverified
          path: dist
      - run: uv run --no-sync jpt release prepare --repository "$REPOSITORY" --tag "$RELEASE_TAG" --environment "$GITHUB_ENV"
      - run: uv run --no-sync jpt test reproducibility 2>&1 | tee dist/evidence/reproducibility.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-reproducibility
  advisories:
    needs: impact
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.audit == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-dotnet@efb1f21818f7d62f31d16d37064ddf5368920a8e # reviewed native NuGet cache setup
        with:
          project-directory: .
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/jellyfin
          key: official-jellyfin-linux-amd64-${{ hashFiles('plugin.toml', 'uv.lock') }}
      - run: uv run --no-sync jpt internal references
      - run: mkdir -p dist/evidence
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync jpt test advisories 2>&1 | tee dist/evidence/advisories.log
      - uses: ./.build/jpt/actions/evidence
        if: always()
        with:
          name: evidence-advisories
  validate:
    needs: [impact, quality, frontend, backend, workflow, rendering, performance, package, installation, reproducibility, advisories]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Report selection failure
        if: needs.impact.result != 'success'
        run: |
          echo "Validation selection failed; inspect the impact job for classification or comparison errors."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validation-plan
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.frontend.result == 'success'
        with:
          name: validation-plan-web
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.package.result == 'success'
        with:
          name: candidate-unverified
          path: dist
      - name: Aggregate required validation and bind evidence to artifacts
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: uv run --no-sync jpt internal ci finish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: plugin-validation-receipt
          path: dist/validation.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && needs.package.result == 'success'
        with:
          name: plugin-candidate
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS
            dist/validation.json
          if-no-files-found: error
