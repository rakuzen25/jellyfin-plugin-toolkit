name: Build draft release artifacts
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        type: string
        default: ""
      validated_run_id:
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: release-artifacts-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.sha || inputs.tag }}
      release_tag: ${{ inputs.tag }}
      release_mode: true
  attach:
    needs: validate
    if: always() && (needs.validate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.validated_run_id != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      VALIDATED_RUN_ID: ${{ inputs.validated_run_id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          persist-credentials: false
      - name: Resolve the authenticated reusable workflow revision
        id: signer
        env:
          EXPECTED_REPOSITORY: rakuzen25/jellyfin-plugin-toolkit
        run: |
          token=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jellyfin-plugin-toolkit")
          claims=$(jq -er '.value | split(".")[1] | gsub("-"; "+") | gsub("_"; "/") | . + ("=" * ((4 - length % 4) % 4)) | @base64d | fromjson' <<< "$token")
          revision=$(jq -er '.job_workflow_sha' <<< "$claims")
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid authenticated revision'; exit 1; }
          expected="$EXPECTED_REPOSITORY/.github/workflows/release.yml@$revision"
          jq -e --arg expected "$expected" '.job_workflow_ref == $expected' <<< "$claims" > /dev/null
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out protected toolkit upload code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rakuzen25/jellyfin-plugin-toolkit
          ref: ${{ steps.signer.outputs.revision }}
          path: .release-tools
          persist-credentials: false
      - name: Isolate the trusted verifier from the consumer project
        run: |
          verifier="$RUNNER_TEMP/jpt-release-verifier"
          cp -a .release-tools "$verifier"
          echo "JPT_VERIFIER_PROJECT=$verifier" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version-file: .release-tools/pyproject.toml
          enable-cache: true
          cache-dependency-glob: .release-tools/uv.lock
      - run: uv sync --project "$JPT_VERIFIER_PROJECT" --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validated_run_id || github.run_id }}
      - name: Verify complete release receipt from the authenticated source run
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --project "$JPT_VERIFIER_PROJECT" --no-sync --no-env-file python -I -m jellyfin_plugin_toolkit.ci verify --root "$PWD" --run-id "${VALIDATED_RUN_ID:-${{ github.run_id }}}"
      - name: Attest the verified validation receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/validation.json
      - name: Verify and attach the tested artifacts
        run: |
          uv run --project "$JPT_VERIFIER_PROJECT" --no-sync --no-env-file python -I -m jellyfin_plugin_toolkit.release --root "$PWD" upload --repository "$REPOSITORY" --tag "$RELEASE_TAG"
      - name: Write handoff
        run: |
          echo "Draft artifacts verified. Review the green validation jobs, then publish the draft in GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing triggers a verified catalog update; see docs/how-to/release.md." >> "$GITHUB_STEP_SUMMARY"
