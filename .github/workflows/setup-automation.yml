name: Configure connected GitHub App
on:
  workflow_call:
    inputs:
      app_client_id:
        type: string
        required: true
      retry_closed:
        type: boolean
        default: false
    secrets:
      PLUGIN_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: app-setup-${{ github.repository }}
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - name: Create repository-scoped setup token
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@27f61490cc183093f30cbf1dba50bb299920b23c # shared App token action
        id: app
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-node@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
      - name: Open or update the reviewed setup PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JPT_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          RETRY_CLOSED: ${{ inputs.retry_closed && github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [ "$RETRY_CLOSED" = true ]; then args+=(--retry-closed); fi
          uv run --no-sync jpt automation setup --repository "$REPOSITORY" "${args[@]}"
