name: Prepare toolkit release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing toolkit draft tag to validate and retry (blank runs release-please)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: toolkit-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked
      - name: Require GitHub App credentials
        if: inputs.tag == ''
        env:
          APP_CLIENT_ID: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
        run: test -n "$APP_CLIENT_ID" && test -n "$APP_PRIVATE_KEY"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: inputs.tag == ''
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        if: inputs.tag == ''
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Refresh the release PR's native uv lockfile
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          REPOSITORY: ${{ github.repository }}
        run: |
          number=$(jq -r '.number' <<< "$RELEASE_PR")
          uv run --no-sync python -m jellyfin_plugin_toolkit.release_lock --repository "$REPOSITORY" --pr "$number" --bot "$RELEASE_BOT"
      - name: Resolve the matching unpublished draft
        id: draft
        if: inputs.tag != '' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: >-
          uv run --no-sync python -m jellyfin_plugin_toolkit.toolkit_release resolve
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --output "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  attach:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Attest the validated distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/build-provenance.json
      - name: Attach the validated distributions to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: >-
          uv run --no-sync python -m jellyfin_plugin_toolkit.toolkit_release upload
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --directory dist
      - name: Record the publication handoff
        run: echo 'Toolkit draft artifacts validated. Review the validated wheel and source distribution before manually publishing the draft.' >> "$GITHUB_STEP_SUMMARY"
