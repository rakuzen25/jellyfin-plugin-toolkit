name: Prepare toolkit release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing toolkit draft tag to validate and retry (blank runs release-please)
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: toolkit-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: runtime
      - name: Create repository-scoped App token
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@27f61490cc183093f30cbf1dba50bb299920b23c # shared App token action
        id: app
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        if: inputs.tag == ''
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve the matching unpublished draft
        id: draft
        if: inputs.tag != '' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: >-
          uv run --no-sync jpt internal toolkit-release resolve
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --output "$GITHUB_OUTPUT"
  select-validation:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      needs_validation: ${{ steps.select.outputs.needs_validation }}
      run_id: ${{ steps.select.outputs.run_id }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: runtime
      - name: Select regular CI's exact tested artifact
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
          IS_RETRY: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        run: |
          args=()
          if [ "$IS_RETRY" = true ]; then args+=(--retry); fi
          uv run --no-sync jpt internal toolkit-release select-validation --sha "$SOURCE_REVISION" --output "$GITHUB_OUTPUT" "${args[@]}"
  validate:
    needs: [prepare, select-validation]
    if: needs.select-validation.outputs.needs_validation == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  attach:
    needs: [prepare, select-validation, validate]
    if: always() && needs.prepare.result == 'success' && needs.select-validation.result == 'success' && (needs.validate.result == 'success' || (needs.validate.result == 'skipped' && needs.select-validation.outputs.artifact_id != ''))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.select-validation.outputs.artifact_id || needs.validate.outputs.artifact_id }}
          run-id: ${{ needs.select-validation.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Attest the validated distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/build-provenance.json
      - name: Create repository-scoped App token
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@27f61490cc183093f30cbf1dba50bb299920b23c # shared App token action
        id: app
        with:
          client-id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Attach the validated distributions to the draft
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: >-
          uv run --no-sync jpt internal toolkit-release upload
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --directory dist
      - name: Record the publication handoff
        run: echo 'Toolkit draft artifacts validated. Review the validated wheel and source distribution before manually publishing the draft.' >> "$GITHUB_STEP_SUMMARY"
