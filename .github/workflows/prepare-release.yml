name: Prepare release
on:
  workflow_call:
    inputs:
      app_client_id:
        type: string
        required: true
    secrets:
      PLUGIN_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: release-please-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' || steps.resume.outputs.release_created == 'true' }}
      tag: ${{ steps.release.outputs.tag_name || steps.resume.outputs.tag }}
      sha: ${{ steps.release.outputs.sha || steps.resume.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/setup-python@1c940009ff2d1b9c13d40d90e024653e004dee79 # reviewed native setup actions
        with:
          project-directory: .
          mode: development
      - run: uv run --no-sync jpt prepare
      - name: Check release update rules before Release Please
        run: uv run --no-sync jpt release config --check
      - name: Create repository-scoped App token
        uses: rakuzen25/jellyfin-plugin-toolkit/.github/actions/app-token@27f61490cc183093f30cbf1dba50bb299920b23c # shared App token action
        id: app
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resume an existing matching unpublished draft
        id: resume
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: uv run --no-sync jpt release resume-draft --repository "$REPOSITORY" --environment "$GITHUB_OUTPUT"
  validate:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}
      base: ${{ github.event.before }}
  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      sha: ${{ needs.release-please.outputs.sha }}
      app_client_id: ${{ inputs.app_client_id }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
