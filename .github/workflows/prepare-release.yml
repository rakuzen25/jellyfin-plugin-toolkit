name: Prepare release
on:
  workflow_call:
    inputs:
      app_client_id:
        type: string
        required: true
    secrets:
      PLUGIN_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: release-please-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' || steps.resume.outputs.release_created == 'true' }}
      tag: ${{ steps.release.outputs.tag_name || steps.resume.outputs.tag }}
      sha: ${{ steps.release.outputs.sha || steps.resume.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync jpt prepare
      - uses: ./.build/jpt/actions/setup
      - name: Check release update rules before Release Please
        run: uv run --no-sync jpt release config --check
      - name: Require GitHub App credentials
        env:
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
          APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_CLIENT_ID" && test -n "$APP_PRIVATE_KEY" || { echo 'Configure PLUGIN_APP_CLIENT_ID and PLUGIN_APP_PRIVATE_KEY for the existing GitHub App'; exit 1; }
      - name: Create repository-scoped App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resume an existing matching unpublished draft
        id: resume
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: uv run --no-sync jpt release resume-draft --repository "$REPOSITORY" --environment "$GITHUB_OUTPUT"
  validate:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}
      base: ${{ github.event.before }}
  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      sha: ${{ needs.release-please.outputs.sha }}
      app_client_id: ${{ inputs.app_client_id }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
