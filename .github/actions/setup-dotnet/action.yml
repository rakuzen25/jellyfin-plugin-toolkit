name: Set up project .NET
description: Install the native SDK pin and optionally cache locked NuGet dependencies
inputs:
  project-directory:
    description: Directory containing global.json and maintained projects
    required: true
  cache:
    description: Cache NuGet dependencies using native package lockfiles
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        global-json-file: ${{ inputs.project-directory }}/global.json
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: ${{ inputs.project-directory }}/**/packages.lock.json
    - name: Prepare the native NuGet cache directory
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      run: |
        nuget_packages_output=$(dotnet nuget locals global-packages --list --force-english-output)
        mkdir -p "${nuget_packages_output#global-packages: }"
